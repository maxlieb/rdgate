name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.0 (publishes a Release)"
        required: false
        default: ""

# Needed so a version tag can create a Release with the installer attached.
permissions:
  contents: write

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...

  windows:
    # The real target. Task Scheduler, netsh, the Caddy and Gitea downloads and
    # the Wails build can only be exercised here, not on Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Core tests on Windows
        run: go test ./...
      - name: Build the CLI for Windows
        run: go build -o build/rdgwctl.exe ./cmd/rdgwctl
      - name: Build the gateway program (rdpgw, Apache-2.0)
        # Pinned to a commit: v9.0.1 has no Windows build of its socket code.
        # Its LICENSE ships next to it, as Apache-2.0 requires for redistribution.
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          git clone https://github.com/bolkedebruin/rdpgw rdpgw-src
          git -C rdpgw-src checkout 468f70cf7524daccb17438b6dd3041f777e6aea5
          Push-Location rdpgw-src
          # The upstream go.sum is incomplete for this tag; -mod=mod fills it in
          # while building, and the pinned tag keeps the result reproducible.
          go build -mod=mod -o ..\build\rdpgw.exe ./cmd/rdpgw
          Pop-Location
          Copy-Item rdpgw-src\LICENSE build\rdpgw-LICENSE.txt
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build the desktop app
        # wails.json lives beside main.go, so the CLI must run from there.
        working-directory: cmd/rdgw-manager
        run: |
          go mod tidy
          wails build -tags wails -platform windows/amd64 -o rdgw-manager.exe
      - name: Build the installer
        run: |
          choco install innosetup -y --no-progress
          mkdir build -Force
          copy cmd\rdgw-manager\build\bin\rdgw-manager.exe build\
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\rdgw-manager.iss
      - uses: actions/upload-artifact@v4
        with:
          name: rdgate-installer
          path: dist/*.exe
      - name: Publish a Release for version tags
        # Publishes on a version tag, or on a manual run with a version entered.
        # Ordinary pushes stop at the artifact.
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          $files = Get-ChildItem dist\*.exe | ForEach-Object { $_.FullName }
          gh release create $env:TAG $files --target $env:SHA `
            --title "RD Gateway $env:TAG" `
            --notes-file CHANGELOG.md
