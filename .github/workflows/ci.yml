name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.9 (publishes a Release). Leave empty to only build."
        required: false
        default: ""

# Needed so a manual run with a version can create a Release with the installer.
permissions:
  contents: write

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...

  windows:
    # The real target. Task Scheduler, netsh, the Caddy and Gitea downloads and
    # the Wails build can only be exercised here, not on Linux.
    runs-on: windows-latest
    env:
      # Pinned so the cache below stays valid. Bump deliberately.
      WAILS_VERSION: v2.17.1
      RDPGW_SHA: 468f70cf7524daccb17438b6dd3041f777e6aea5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Point the Go build cache at a known folder
        run: |
          "GOCACHE=${{ runner.temp }}\gocache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore the Go build cache
        # Compiled packages (including the big Wails dependency tree) are reused
        # between runs. The key follows go.sum, so a dependency change rebuilds.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\gocache
          key: gocache-windows-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            gocache-windows-${{ hashFiles('**/go.sum') }}-
            gocache-windows-
      - name: Core tests on Windows
        run: go test ./...
      - name: Build the CLI for Windows
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          go build -o build/rdgwctl.exe ./cmd/rdgwctl

      - name: Restore the gateway program from cache
        id: rdpgw-cache
        uses: actions/cache@v4
        with:
          path: |
            build/rdpgw.exe
            build/rdpgw-LICENSE.txt
            build/rdpgw-templates
            build/rdpgw-assets
          key: rdpgw-v3-${{ env.RDPGW_SHA }}
      - name: Build the gateway program (rdpgw, Apache-2.0)
        # Only runs when the cache misses, i.e. when the pinned commit changes.
        if: steps.rdpgw-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/bolkedebruin/rdpgw rdpgw-src
          git -C rdpgw-src checkout $env:RDPGW_SHA
          Push-Location rdpgw-src
          # The upstream go.sum is incomplete for this commit; -mod=mod fills it in.
          go build -mod=mod -o ..\build\rdpgw.exe ./cmd/rdpgw
          Pop-Location
          Copy-Item rdpgw-src\LICENSE build\rdpgw-LICENSE.txt
          # The gateway serves its web pages from a templates folder beside rdpgw.exe.
          Copy-Item -Recurse -Force rdpgw-src\cmd\rdpgw\templates build\rdpgw-templates
          # The page also loads its logos from an assets folder beside the gateway.
          Copy-Item -Recurse -Force rdpgw-src\assets build\rdpgw-assets

      - name: Fetch Git (MinGit, GPL-2.0) for the installer
        # Pinned like Wails and rdpgw, so a new upstream release cannot break the build.
        env:
          MINGIT_VERSION: "2.53.0"
        run: |
          $url = "https://github.com/git-for-windows/git/releases/download/v$env:MINGIT_VERSION.windows.1/MinGit-$env:MINGIT_VERSION-64-bit.zip"
          Invoke-WebRequest -Uri $url -OutFile mingit.zip
          Expand-Archive -Path mingit.zip -DestinationPath build\git -Force
          Remove-Item mingit.zip

      - name: Restore the Wails CLI from cache
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\gobin\wails.exe
          key: wails-${{ env.WAILS_VERSION }}-windows
      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        env:
          # Where `go install` puts the CLI, so the cache step can find it by path.
          GOBIN: ${{ runner.temp }}\gobin
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VERSION
      - name: Put Wails on the PATH
        run: |
          "${{ runner.temp }}\\gobin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build the desktop app
        # wails.json lives beside main.go, so the CLI must run from there.
        working-directory: cmd/rdgw-manager
        run: |
          # go.mod does not list Wails until tidy adds it, so this must stay.
          go mod tidy
          wails build -tags wails -platform windows/amd64 -o rdgate.exe
      - name: Build the installer
        run: |
          # Installing Inno Setup takes a while, so skip it when the runner already has it.
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item cmd\rdgw-manager\build\bin\rdgate.exe build\
      - name: Sign the program files
        # Does nothing unless the signing secrets are set. See installer\sign.ps1.
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: installer\sign.ps1 -Files build\rdgate.exe, build\rdgwctl.exe -ExportCertificate
      - name: Build the installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\rdgw-manager.iss
      - name: Sign the installer
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: installer\sign.ps1 -Files dist\*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rdgate-installer
          path: dist/*.exe
      - name: Publish a Release for a manual run with a version
        # Only a manual run with a version entered publishes. Pushes stop at the artifact.
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          $files = Get-ChildItem dist\*.exe | ForEach-Object { $_.FullName }
          # Only this version's section of the changelog goes into the release notes.
          $version = $env:TAG.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version))\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $version" }
          $notes = Join-Path $env:RUNNER_TEMP "notes.md"
          $m.Groups[1].Value.Trim() | Set-Content -Path $notes -Encoding utf8
          gh release create $env:TAG $files --target $env:SHA `
            --title "RD Gateway $env:TAG" `
            --notes-file $notes
