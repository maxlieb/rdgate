<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDGate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22bg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231FB5AE%22/%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230B4F5C%22/%3E%0A%20%20%20%20%3C/linearGradient%3E%0A%20%20%3C/defs%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22url%28%23bg%29%22/%3E%0A%20%20%3C%21--%20the%20gate%3A%20an%20arch%2C%20with%20its%20ground%20line%20--%3E%0A%20%20%3Cpath%20d%3D%22M142%20378%20V246%20A114%20114%200%200%201%20370%20246%20V378%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%3Cpath%20d%3D%22M112%20392%20H400%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2230%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%3C%21--%20the%20remote%20screen%20behind%20the%20gate%20--%3E%0A%20%20%3Crect%20x%3D%22200%22%20y%3D%22232%22%20width%3D%22112%22%20height%3D%2278%22%20rx%3D%2212%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2216%22/%3E%0A%20%20%3Cpath%20d%3D%22M256%20310%20V322%20M226%20326%20H286%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2214%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%3C%21--%20the%20connection%20leaving%20through%20the%20gate%20--%3E%0A%20%20%3Cpath%20d%3D%22M370%20271%20H424%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2218%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%3Ccircle%20cx%3D%22450%22%20cy%3D%22271%22%20r%3D%2224%22%20fill%3D%22%23FFFFFF%22/%3E%0A%3C/svg%3E">
<!-- No webfont link, deliberately. A <link rel="stylesheet"> blocks the inline
     script below until it resolves, so a remote font request leaves this
     window blank whenever the network is unreachable - which is exactly when
     someone opens this app. To use IBM Plex instead of the system stack, drop
     the .woff2 files into frontend/fonts/ and uncomment the @font-face rules:
     they are local files, so they cannot stall. -->
<style>
/*
@font-face { font-family:"IBM Plex Sans"; src:url("fonts/IBMPlexSans-Regular.woff2") format("woff2");
             font-weight:400; font-display:swap; }
@font-face { font-family:"IBM Plex Sans"; src:url("fonts/IBMPlexSans-Medium.woff2") format("woff2");
             font-weight:500; font-display:swap; }
@font-face { font-family:"IBM Plex Sans"; src:url("fonts/IBMPlexSans-SemiBold.woff2") format("woff2");
             font-weight:600; font-display:swap; }
@font-face { font-family:"IBM Plex Mono"; src:url("fonts/IBMPlexMono-Regular.woff2") format("woff2");
             font-weight:400; font-display:swap; }
*/
/* ---------------------------------------------------------------------------
   The product is a chain: this PC -> gateway -> sign-in -> Tailscale -> the
   public internet. Any broken link and nobody can connect. So the dashboard
   is drawn as one continuous run with a visible break, rather than a grid of
   independent cards that leaves the user to work out which failure matters.
   --------------------------------------------------------------------------- */
:root {
  --paper:      #E8ECEF;  /* cool drafting paper, not cream */
  --paper-rise: #F4F6F8;  /* raised surfaces */
  --ink:        #0F2A33;  /* petrol ink */
  --ink-soft:   #5A7079;
  --ink-faint:  #9BABB2;
  --rule:       #C6D0D6;

  --live:       #10695A;  /* deep viridian: carrying signal */
  --attention:  #B5471B;  /* burnt sienna: the path is cut */
  --waiting:    #8A6A1F;  /* ochre: works, but not finished */

  --gutter: 28px;
  --radius: 3px;          /* near-square: this is instrumentation, not a card */
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #0C1A20;
    --paper-rise: #112730;
    --ink:        #DCE6EA;
    --ink-soft:   #8FA4AC;
    --ink-faint:  #5A7079;
    --rule:       #23414C;
    --live:       #3FBFA3;
    --attention:  #E8814F;
    --waiting:    #D4A542;
  }
}
:root[data-theme="dark"] {
  --paper:      #0C1A20;
  --paper-rise: #112730;
  --ink:        #DCE6EA;
  --ink-soft:   #8FA4AC;
  --ink-faint:  #5A7079;
  --rule:       #23414C;
  --live:       #3FBFA3;
  --attention:  #E8814F;
  --waiting:    #D4A542;
}

* { box-sizing: border-box; }

/* The hidden attribute is only display:none in the UA stylesheet, so any
   author rule setting display (.verdict is flex) silently outranks it. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }

/* --- top bar -------------------------------------------------------------- */

.bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 18px 0 16px;
  border-bottom: 1px solid var(--rule);
}
.wordmark { font-weight: 600; letter-spacing: -0.01em; }
.verdict { display: flex; align-items: center; gap: 9px; font-weight: 500; }
.verdict .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--live); }
.verdict[data-state="attention"] .dot { background: var(--attention); }
.verdict[data-state="waiting"]   .dot { background: var(--waiting); }
.verdict[data-state="attention"] { color: var(--attention); }
.verdict[data-state="waiting"]   { color: var(--waiting); }

/* --- hero: the address is the product ------------------------------------- */

.address { padding: 34px 0 30px; border-bottom: 1px solid var(--rule); }
.address h1 {
  margin: 0 0 4px;
  font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  font-size: clamp(20px, 5.2vw, 29px);
  font-weight: 500; letter-spacing: -0.02em; line-height: 1.2;
  word-break: break-all;
}
.address .sub { color: var(--ink-soft); font-size: 14px; }
.address .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

button {
  font: inherit; font-size: 14px; font-weight: 500;
  padding: 8px 15px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
  transition: opacity .12s ease;
}
button:hover { opacity: .86; }
button.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
button.ghost:hover { border-color: var(--ink-soft); opacity: 1; }
button:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
button[disabled] { opacity: .4; cursor: default; }

/* --- the signal path ------------------------------------------------------ */

.path { padding: 26px 0 0; }
.path-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px; color: var(--ink-soft); font-size: 13px;
}

.link { position: relative; padding-left: var(--gutter); }

/* The run is drawn by each link's own ::before, so a break is a property of
   the link rather than a separately positioned decoration that could drift. */
.link::before {
  content: ""; position: absolute; left: 4px; top: 0; bottom: 0;
  border-left: 2px solid var(--live);
}
.link:first-child::before { top: 18px; }
.link:last-child::before  { bottom: calc(100% - 18px); }
.link[data-state="attention"]::before,
.link[data-state="severed"]::before { border-left-style: dotted; border-left-color: var(--attention); }
.link[data-state="waiting"]::before { border-left-color: var(--waiting); }
.link[data-state="unknown"]::before { border-left-color: var(--ink-faint); border-left-style: dotted; }

.node {
  position: absolute; left: 0; top: 13px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--live);
}
.link[data-state="attention"] .node { border-color: var(--attention); background: var(--attention); }
.link[data-state="waiting"]   .node { border-color: var(--waiting); }
.link[data-state="unknown"]   .node { border-color: var(--ink-faint); }

.link-body {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 14px; padding: 9px 0;
}
.link-name { font-weight: 500; }
.link-value {
  color: var(--ink-soft); font-size: 13.5px; text-align: right;
  font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
}
.link[data-state="attention"] .link-value { color: var(--attention); }
.link[data-state="waiting"]   .link-value { color: var(--waiting); }

/* Guidance appears only where the path is cut, at the point it is cut. */
.fix {
  margin: 2px 0 14px; padding: 13px 15px;
  background: var(--paper-rise); border: 1px solid var(--rule);
  border-left: 2px solid var(--attention);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.link[data-state="waiting"] .fix { border-left-color: var(--waiting); }
.fix p { margin: 0 0 11px; font-size: 14px; color: var(--ink-soft); max-width: 62ch; }
.fix p:last-child { margin-bottom: 0; }

/* --- footer --------------------------------------------------------------- */

.foot {
  margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--rule);
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap;
  color: var(--ink-faint); font-size: 13px;
}
.foot-actions { display: flex; gap: 8px; }

/* --- first run ------------------------------------------------------------
   The dashboard shows a route; setup shows a sequence. Numbering is used here
   and nowhere else, because here the order is the information. */

.intro { padding: 36px 0 26px; }
.intro h1 { margin: 0 0 8px; font-size: clamp(22px, 5vw, 30px); font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.15; }
.intro p { margin: 0; color: var(--ink-soft); max-width: 54ch; }

.steps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 14px;
  padding: 18px 0; border-bottom: 1px solid var(--rule); }

.step-num {
  width: 24px; height: 24px; border-radius: 50%; margin-top: 1px;
  display: grid; place-items: center;
  font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums;
  border: 1px solid var(--rule); color: var(--ink-faint); background: transparent;
}
.step[data-state="current"] .step-num { border-color: var(--ink); color: var(--paper); background: var(--ink); }
.step[data-state="done"] .step-num { border-color: var(--live); color: var(--live); }

.step-title { font-weight: 500; }
.step[data-state="todo"] .step-title { color: var(--ink-faint); }
.step-note { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; max-width: 58ch; }
.check-row { margin: 10px 0 0; }
.check-row strong { font-weight: 600; }
.step-note code {
  font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  font-size: 12.5px; background: var(--paper-rise);
  border: 1px solid var(--rule); border-radius: var(--radius); padding: 1px 5px;
  word-break: break-all;
}
.step-actions { margin-top: 13px; display: flex; gap: 8px; flex-wrap: wrap; }

.targets { margin: 12px 0 0; display: grid; gap: 8px; }
.target {
  display: flex; align-items: center; gap: 10px; padding: 10px 13px;
  background: var(--paper-rise); border: 1px solid var(--rule);
  border-radius: var(--radius); cursor: pointer;
}
.target input { accent-color: var(--live); width: 15px; height: 15px; }
.target-name { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  font-size: 13.5px; }
.target-note { margin-left: auto; color: var(--ink-faint); font-size: 12.5px; }

.add-target { display: flex; gap: 8px; margin-top: 8px; }
.add-target input[type="text"] {
  flex: 1; font: inherit; font-size: 14px; padding: 8px 11px; color: var(--ink);
  background: var(--paper-rise); border: 1px solid var(--rule); border-radius: var(--radius);
}
.add-target input:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }

.progress { margin: 12px 0 0; display: grid; gap: 6px; }
.progress-row { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.progress-row .mark { width: 14px; color: var(--ink-faint); flex: none; }
.progress-row[data-state="done"] .mark { color: var(--live); }
.progress-row[data-state="failed"] { color: var(--attention); }
.progress-row[data-state="failed"] .mark { color: var(--attention); }
.progress-row .msg { color: var(--ink-soft); margin-left: auto; text-align: right;
  font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  font-size: 12.5px; }

.handover {
  margin-top: 14px; padding: 15px 17px; border: 1px solid var(--rule);
  border-left: 2px solid var(--live); background: var(--paper-rise);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.handover dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; }
.handover dt { color: var(--ink-soft); font-size: 13.5px; }
.handover dd { margin: 0; font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  font-size: 13.5px; word-break: break-all; }
.handover .warn { margin: 12px 0 0; font-size: 13.5px; color: var(--attention); }


.choices { margin: 12px 0 0; display: grid; gap: 8px; }
.choice {
  display: grid; grid-template-columns: 18px 1fr; gap: 3px 12px; padding: 12px 14px;
  background: var(--paper-rise); border: 1px solid var(--rule);
  border-radius: var(--radius); cursor: pointer;
}
.choice:has(input:checked) { border-color: var(--ink); box-shadow: inset 2px 0 0 var(--ink); }
.choice input { accent-color: var(--ink); margin-top: 3px; }
.choice-title { font-weight: 500; }
.choice-text { grid-column: 2; color: var(--ink-soft); font-size: 13.5px; max-width: 60ch; }
.choice-cost { grid-column: 2; font-size: 12.5px; color: var(--ink-faint); }

.fields { margin: 12px 0 0; display: grid; gap: 10px; max-width: 460px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13.5px; color: var(--ink-soft); }
.field input[type="text"], .field input[type="password"] {
  font: inherit; font-size: 14px; padding: 8px 11px; color: var(--ink);
  background: var(--paper-rise); border: 1px solid var(--rule); border-radius: var(--radius);
}
.field input:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
.field small { color: var(--ink-faint); font-size: 12.5px; }

.verdict-box { margin: 12px 0 0; padding: 11px 14px; border: 1px solid var(--rule);
  border-left-width: 2px; background: var(--paper-rise); font-size: 14px; max-width: 60ch;
  border-radius: 0 var(--radius) var(--radius) 0; }
.verdict-box[data-state="ok"]   { border-left-color: var(--live); }
.verdict-box[data-state="bad"]  { border-left-color: var(--attention); }
.verdict-box[data-state="meh"]  { border-left-color: var(--waiting); }

details.guide { margin: 12px 0 0; border-top: 1px solid var(--rule); padding-top: 10px; max-width: 62ch; }
details.guide summary { cursor: pointer; font-weight: 500; }
details.guide ol { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 9px;
  color: var(--ink-soft); font-size: 14px; }
details.guide li b { color: var(--ink); font-weight: 500; }
pre.script { margin: 10px 0 0; max-height: 150px; overflow: auto; padding: 10px 12px; font-size: 12px;
  background: var(--paper-rise); border: 1px solid var(--rule); border-radius: var(--radius);
  font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, ui-monospace, monospace; }

.spin { display: inline-block; width: 11px; height: 11px; border-radius: 50%;
  border: 2px solid var(--ink-faint); border-top-color: transparent;
  animation: rot .7s linear infinite; vertical-align: -1px; }
@keyframes rot { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
.brand { display: inline-flex; align-items: center; gap: .5rem; }
.brand svg { width: 1.6rem; height: 1.6rem; flex: none; }
.choice-speed { grid-column: 2; margin-top: 2px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
.choice-speed.fast { color: var(--live); }
.choice-speed.slow { color: var(--waiting); }
</style>
</head>
<body>
<div class="wrap">

  <header class="bar">
    <span class="brand"><svg viewBox="0 0 512 512" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FB5AE"/>
      <stop offset="1" stop-color="#0B4F5C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the gate: an arch, with its ground line -->
  <path d="M142 378 V246 A114 114 0 0 1 370 246 V378" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  <path d="M112 392 H400" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
  <!-- the remote screen behind the gate -->
  <rect x="200" y="232" width="112" height="78" rx="12" fill="none" stroke="#FFFFFF" stroke-width="16"/>
  <path d="M256 310 V322 M226 326 H286" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <!-- the connection leaving through the gate -->
  <path d="M370 271 H424" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <circle cx="450" cy="271" r="24" fill="#FFFFFF"/>
</svg>
<span class="wordmark">RDGate</span></span>
    <span class="verdict" id="verdict" hidden><span class="dot"></span><span id="verdict-text">Checking</span></span>
  </header>

  <!-- First run. Steps are genuinely sequential, so they are numbered; the
       dashboard's path is not a sequence and deliberately is not. -->
  <main id="wizard" hidden>
    <section class="intro">
      <h1>Let's make this PC reachable</h1>
      <p>You can close this and come back &mdash; it picks up where you left off.</p>
    </section>
    <ol class="steps" id="steps"></ol>
  </main>

  <main id="dashboard" hidden>
  <section class="address">
    <h1 id="hostname">&mdash;</h1>
    <div class="sub" id="address-sub">Looking for your machine</div>
    <div class="actions">
      <button id="open-portal">Open portal</button>
      <button class="ghost" id="copy-address">Copy address</button>
    </div>
  </section>

  <section class="path">
    <div class="path-head">
      <span>From this PC to the internet</span>
      <span id="checked-at"></span>
    </div>
    <div id="links"></div>
  </section>

  <footer class="foot">
    <span id="foot-note"></span>
    <span class="foot-actions">
      <button class="ghost" id="recheck">Check again</button>
      <button class="ghost" id="stop-gw" title="Stops the gateway program. Sign-in and the web front end keep running.">Stop gateway</button>
      <button class="ghost" id="start-gw" title="Starts the gateway program again.">Start gateway</button>
      <button class="ghost" id="change-pw" title="Sets a new password for the gateway account. It is shown once.">Change password</button>
      <button class="ghost" id="users" title="Opens Gitea's user administration on this PC. Add people and set their accounts here.">Manage users</button>
      <button class="ghost" id="repair" title="Rewrites the gateway's config and web pages, then restarts it. Nothing is reinstalled.">Repair gateway</button>
      <button class="ghost" id="settings">Settings</button>
    </span>
  </footer>
  </main>

</div>

<script>
// The backend hands over the same Status struct the CLI prints. Order here is
// the physical order of the path, which is not the order the checks happen to
// run in - the user reads a route, not a task list.
const PATH_ORDER = [
  "Remote Desktop", "Gateway service", "Sign-in service",
  "Two-factor", "Tailscale", "Public address",
];

// Plain-language names. The backend speaks in service names because that is
// what its logs say; the person at the keyboard should not have to.
const LABELS = {
  "Remote Desktop":  "Remote Desktop on this PC",
  "Gateway service": "Gateway",
  "Sign-in service": "Sign-in",
  "Two-factor":      "Two-factor",
  "Tailscale":       "Tailscale",
  "Public address":  "Reachable from the internet",
};

// Each fixable problem gets one button that does the obvious thing, so the
// user is never told what is wrong without being offered the way out.
const REMEDIES = {
  "Remote Desktop": { label: "Open Remote Desktop settings", call: "OpenRDPSettings" },
  "Public address": { label: "Publish again",                call: "EnableFunnel" },
  "Two-factor":     { label: "Repair gateway",               call: "RepairGateway" },
  "Gateway service":{ label: "Repair gateway",               call: "RepairGateway" },
  "Sign-in service":{ label: "Restart sign-in",              call: "RestartSignIn" },
};

const state = { status: null, busy: false, door: "funnel" };

// What the fix button for the public address does depends on how the gateway
// is reached: republishing means nothing for a relay, where the useful thing
// is to hand over the server script again.
function remedyFor(name) {
  if (name === "Public address") {
    if (state.door === "relay")
      return { label: "Copy the server script", call: "RelayScript", copy: true };
    if (state.door === "direct")
      return { label: "Test it now", call: "TestPublic" };
  }
  return REMEDIES[name];
}

// NOT named "go": a top-level `function go()` declaration creates a global
// binding that overwrites the window.go object Wails injects, after which
// every backend call silently fails. Found by running it, not by reading it.
//
// The namespace is the Go package the bound struct lives in. That is "ui" in
// this app, not "main", so it is looked up rather than assumed: a hard-coded
// name worked in the browser mock and failed silently in the real window.
function backend() {
  const ns = window.go || {};
  for (const pkg of Object.keys(ns)) {
    if (ns[pkg] && ns[pkg].App) return ns[pkg].App;
  }
  return null;
}

function callBackend(name, ...args) {
  const app = backend();
  const fn = app && app[name];
  return fn ? fn(...args) : Promise.reject(new Error(name + " unavailable"));
}

function severity(checks) {
  if (checks.some(c => c.state === "fail")) return "attention";
  if (checks.some(c => c.state === "warn" || c.state === "unknown")) return "waiting";
  return "live";
}

function render(status) {
  // The dashboard refreshes every few seconds. Rebuilding an unchanged list
  // swallows clicks that began on a button and drops any text selection, so
  // a redraw only happens when something actually changed.
  // checkedAt changes on every call, so it is left out of the comparison and
  // the "checked" label is updated on its own below.
  const { checkedAt, ...same } = status;
  const key = JSON.stringify([same, state.door]);
  if (key === state.renderKey) {
    document.getElementById("checked-at").textContent =
      checkedAt ? "checked " + timeAgo(new Date(checkedAt)) : "";
    return;
  }
  state.renderKey = key;
  state.status = status;
  const checks = [...(status.checks || [])].sort(
    (a, b) => PATH_ORDER.indexOf(a.name) - PATH_ORDER.indexOf(b.name));

  const worst = severity(checks);
  const verdict = document.getElementById("verdict");
  verdict.dataset.state = worst === "live" ? "" : worst;
  document.getElementById("verdict-text").textContent =
    worst === "live" ? "Reachable" : worst === "attention" ? "Not reachable" : "Needs a moment";

  document.getElementById("hostname").textContent = status.hostname || "Not set up yet";
  document.getElementById("address-sub").textContent =
    worst === "live"
      ? "Anyone you give this address to can reach the sign-in page."
      : "This address will work once the path below is unbroken.";

  const portal = document.getElementById("open-portal");
  portal.disabled = !status.hostname || worst === "attention";
  document.getElementById("copy-address").disabled = !status.hostname;

  // Everything after the first break is unreachable regardless of its own
  // state, so it is drawn as severed rather than as a second failure. One
  // problem should look like one problem.
  let broken = false;
  const host = document.getElementById("links");
  host.textContent = "";

  for (const c of checks) {
    const el = document.createElement("div");
    el.className = "link";
    const own = c.state === "fail" ? "attention"
              : c.state === "warn" ? "waiting"
              : c.state === "unknown" ? "unknown" : "ok";
    el.dataset.state = broken && own === "ok" ? "severed" : own;
    if (own === "attention") broken = true;

    const node = document.createElement("span");
    node.className = "node";
    el.appendChild(node);

    const body = document.createElement("div");
    body.className = "link-body";
    const name = document.createElement("span");
    name.className = "link-name";
    name.textContent = LABELS[c.name] || c.name;
    const value = document.createElement("span");
    value.className = "link-value";
    value.textContent = c.detail || "";
    body.append(name, value);
    el.appendChild(body);

    if (c.hint && own !== "ok") {
      const fix = document.createElement("div");
      fix.className = "fix";
      const p = document.createElement("p");
      p.textContent = c.hint;
      fix.appendChild(p);
      const r = remedyFor(c.name);
      if (r) {
        const b = document.createElement("button");
        b.textContent = r.label;
        b.addEventListener("click", () => act(b, r));
        fix.appendChild(b);
      }
      el.appendChild(fix);
    }
    host.appendChild(el);
  }

  document.getElementById("checked-at").textContent =
    status.checkedAt ? "checked " + timeAgo(new Date(status.checkedAt)) : "";
  document.getElementById("foot-note").textContent =
    worst === "live" ? "Everything is running." : "";
}

async function act(button, remedy) {
  const original = button.textContent;
  button.disabled = true;
  button.textContent = "Working…";
  try {
    // A call that never returns must not leave the button on "Working…" forever.
    const out = await Promise.race([
      callBackend(remedy.call),
      new Promise((_, reject) => setTimeout(() => reject(new Error("timed out")), 120000)),
    ]);
    if (remedy.copy && typeof out === "string") {
      await navigator.clipboard.writeText(out);
      button.textContent = "Copied";
      setTimeout(() => { button.textContent = original; button.disabled = false; }, 1800);
      return;
    }
    await refresh();
  } catch (err) {
    button.textContent = "Could not do that";
    console.warn(remedy.call, err);
    setTimeout(() => { button.textContent = original; button.disabled = false; }, 2500);
  }
}

function timeAgo(d) {
  const s = Math.max(0, (Date.now() - d.getTime()) / 1000);
  if (s < 45) return "just now";
  if (s < 90) return "a minute ago";
  return Math.round(s / 60) + " minutes ago";
}

async function refresh() {
  if (state.busy) return;
  state.busy = true;
  const btn = document.getElementById("recheck");
  const prev = btn.textContent;
  btn.innerHTML = '<span class="spin"></span>';
  try {
    try { state.door = (await callBackend("GetSettings")).door || "funnel"; } catch {}
    render(await callBackend("Status"));
  } catch (err) {
    console.warn("status unavailable", err);
    // Say so on screen. A blank window with no explanation is the failure
    // this avoids: it looks like the app is broken for no reason.
    const host = document.getElementById("steps") || document.body;
    const box = document.createElement("div");
    box.className = "verdict-box"; box.dataset.state = "bad";
    box.textContent = "The app could not reach its own back end (" + (err?.message || err) +
      "). Close it and open it again; if this repeats, send the message above.";
    host.appendChild(box);
  } finally {
    btn.textContent = prev;
    state.busy = false;
  }
}

document.getElementById("recheck").addEventListener("click", refresh);

// The settings panel shows what is set up and where it points. Keys and
// secrets are never sent here, so there is nothing sensitive to show.
function showSettings(s) {
  let panel = document.getElementById("settings-panel");
  if (!panel) {
    panel = document.createElement("div");
    panel.id = "settings-panel";
    panel.className = "verdict-box";
    panel.dataset.state = "";
    document.querySelector("footer.foot").before(panel);
  }
  panel.textContent = "";
  const doors = { funnel: "Tailscale Funnel", relay: "Your own server (relay)", direct: "Straight to this PC" };
  const h = document.createElement("p");
  h.innerHTML = "<strong>Settings</strong>";
  const dl = document.createElement("dl");
  for (const [k, v] of [
    ["Way in", doors[s.door] || s.door],
    ["Address people type", s.portal],
    ["Sign-in address", s.signIn],
    ["Sign-in account", s.adminUser],
    ["Computers the gateway may reach", (s.targets || []).join(", ") || "none"],
  ]) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  }
  const row = document.createElement("div");
  row.className = "actions";
  const open = document.createElement("button");
  open.className = "ghost";
  open.textContent = "Open install folder";
  open.title = "Config files, the Caddy and gateway configs, and the logs.";
  open.addEventListener("click", () => callBackend("OpenInstallFolder"));
  const close = document.createElement("button");
  close.className = "ghost";
  close.textContent = "Close";
  close.addEventListener("click", () => panel.remove());
  row.append(open, close);

  // Updates: the check is manual. The install closes RDGate and takes the
  // gateway down for about a minute, so it always asks first.
  const upRow = document.createElement("div");
  upRow.className = "actions";
  const upNote = document.createElement("p");
  upNote.className = "choice-text";
  const check = document.createElement("button");
  check.className = "ghost";
  check.textContent = "Check for updates";
  check.addEventListener("click", async () => {
    check.disabled = true;
    upNote.textContent = "Checking…";
    try {
      const st = await callBackend("CheckUpdate");
      if (!st.newer) {
        upNote.textContent = "You have the latest version (" + st.current + ").";
      } else if (!st.canInstall) {
        upNote.textContent = "Version " + st.latest + " is available, but this install cannot check it: " + st.reason;
      } else {
        upNote.textContent = "Version " + st.latest + " is available.";
        const install = document.createElement("button");
        install.textContent = "Install " + st.latest;
        install.addEventListener("click", async () => {
          if (!confirm("RDGate will close and reopen. The gateway is down for about a minute while it installs. Continue?")) return;
          install.disabled = true;
          upNote.textContent = "Installing… RDGate will close and reopen.";
          try {
            await callBackend("InstallUpdate");
          } catch (err) {
            upNote.textContent = "The update did not start: " + err;
            install.disabled = false;
          }
        });
        upRow.appendChild(install);
      }
    } catch (err) {
      upNote.textContent = "Could not check for updates: " + err;
    } finally {
      check.disabled = false;
    }
  });
  upRow.prepend(check);
  panel.append(h, dl, row, upRow, upNote);
}

const wiz = {
  door: null,                 // chosen on the first screen
  form: { domain: "", email: "", ddns: "duck", duckName: "", duckToken: "", ddnsUrl: "",
          accountName: "rdgw", accountPass: "", accountPass2: "" },
  directCheck: null, directAck: false, addressOk: false, funnelOk: false, funnelLast: null, funnelAt: 0,
  accountOk: false, account: null, speed: null, speedRunning: false,
  pinned: null,               // a step the person went Back to; null means the first unfinished one
  targets: [], installing: false, result: null, progress: [],
};

const DOORS = [
  { id: "funnel", title: "Tailscale Funnel",
    text: "The quickest way: a few clicks and it works, even on internet connections that cannot be " +
          "reached directly. The address ends in .ts.net, which some company networks block.",
    cost: "Free. No server, no domain." },
  { id: "direct", title: "Straight to this PC",
    text: "Your router sends the traffic here, and a free name service keeps the address current. " +
          "Usually the fastest, but this PC is then reachable from the internet itself, so it is less " +
          "secure than the other two: keep the sign-in strong. Only works if your provider gives you your own public address.",
    cost: "Free. Needs one port opened on your router; the app checks that your connection allows it." },
  { id: "relay", title: "Through a small server of your own",
    text: "A tiny free server holds your domain name and passes traffic to this PC. Works on any " +
          "connection, opens nothing on your router, and the address looks like any ordinary website.",
    cost: "Costs a few dollars a year. About 20 minutes, once." },
];

// The path through the wizard depends on the way chosen. Each step says for
// itself whether it is finished, so the current step is whatever comes first
// and is not - closing the window and reopening it resumes in the right place.
function wizardSteps(w) {
  const door = wiz.door;
  const steps = [{ title: "Choose how to reach it", done: () => !!door, build: () => buildDoor(w) }];
  if (!door) return steps;

  if (door === "direct") {
    steps.push({ title: "Check your connection", done: () => wiz.directAck, build: () => buildDirectCheck(w) });
  } else {
    steps.push({ title: "Connect Tailscale",
      done: () => w.tailscaleInstalled && w.signedIn, build: () => buildTailscale(w) });
  }
  if (door === "funnel") {
    steps.push({ title: "Turn on Funnel for this PC", done: () => wiz.funnelOk, build: () => buildFunnelSetup(w) });
  }
  if (door !== "funnel") {
    steps.push({ title: door === "direct" ? "Pick your address" : "Your domain name",
      done: () => wiz.addressOk, build: () => buildAddress(w) });
  }
  steps.push({ title: "Choose the sign-in account", done: () => wiz.accountOk, build: () => buildAccount(w) });
  steps.push({ title: "Add the gateway program", done: () => w.rdpgwPresent, build: () => buildRdpgw(w) });
  steps.push({ title: "Choose what to reach", done: () => !!wiz.result, build: () => buildTargets(w) });
  steps.push({ title: door === "relay" ? "Set up the server" : "Finish setting up",
    done: () => false, build: () => buildFinish(w) });
  return steps;
}

function renderWizard(w) {
  const steps = wizardSteps(w);
  let cur = steps.findIndex(s => !s.done());
  if (cur < 0) cur = steps.length - 1;
  // Going Back shows an earlier step without undoing anything: its answers are
  // kept, and pressing any button in it moves on again.
  if (wiz.pinned != null && wiz.pinned < cur) cur = Math.max(0, wiz.pinned);
  const host = document.getElementById("steps");
  host.textContent = "";
  if (!host.dataset.backHook) {
    host.dataset.backHook = "1";
    host.addEventListener("click", (e) => {
      const b = e.target.closest && e.target.closest("button");
      if (!b || b.dataset.back === "1") return;
      // Checks, measurements and links keep the step being reviewed in place.
      if (/^(Measure|Check|Open|Copy|Show)/.test(b.textContent)) return;
      wiz.pinned = null;
    }, true);
  }

  steps.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "step";
    li.dataset.state = i < cur ? "done" : i === cur ? "current" : "todo";

    const num = document.createElement("span");
    num.className = "step-num";
    num.textContent = i < cur ? "✓" : String(i + 1);

    const body = document.createElement("div");
    const title = document.createElement("div");
    title.className = "step-title";
    title.textContent = s.title;
    body.appendChild(title);

    // Only the step in hand is expanded. Showing every step's detail at once
    // is how a setup starts to feel like a form.
    if (i === cur) {
      const detail = s.build();
      if (detail) body.appendChild(detail);
      if (i > 0) {
        const back = button("Back", () => { wiz.pinned = cur - 1; renderWizard(w); }, true);
        back.dataset.back = "1";
        body.appendChild(actions(back));
      }
    }

    li.append(num, body);
    host.appendChild(li);
  });
}

function note(html) {
  const p = document.createElement("p");
  p.className = "step-note";
  p.innerHTML = html;
  return p;
}

function actions(...buttons) {
  const d = document.createElement("div");
  d.className = "step-actions";
  buttons.forEach(b => b && d.appendChild(b));
  return d;
}

function button(label, onClick, ghost) {
  const b = document.createElement("button");
  if (ghost) b.className = "ghost";
  b.textContent = label;
  // Continue moves forward, so it is the only button that releases a Back position.
  if (label === "Continue") b.dataset.next = "1";
  b.addEventListener("click", () => onClick(b));
  return b;
}

// What the speed check says on each option card. Only the fastest Oracle
// region is shown, not the whole list.
function choiceSpeedText(id) {
  const r = wiz.speed;
  if (!r) return "";
  if (id === "funnel") {
    if (r.funnel && r.funnel.ok) return r.funnel.ms + " ms to your Funnel address";
    if (r.reference && r.reference.ok) return r.reference.ms + " ms to Tailscale (stand-in)";
    return "Tailscale did not answer from here";
  }
  if (id === "relay") {
    const fast = r.regions && r.regions.find(p => p.name === r.fastest);
    return fast ? "Fastest region: " + fast.city + ", " + fast.ms + " ms"
                : "No Oracle region answered from here";
  }
  return "No server to measure";
}

// The number a card shows, for comparing the two network options.
function speedMs(id) {
  const r = wiz.speed;
  if (!r) return null;
  if (id === "funnel") {
    if (r.funnel && r.funnel.ok) return r.funnel.ms;
    if (r.reference && r.reference.ok) return r.reference.ms;
    return null;
  }
  if (id === "relay") {
    const fast = r.regions && r.regions.find(p => p.name === r.fastest);
    return fast ? fast.ms : null;
  }
  return null;
}

// Green marks the faster of Tailscale and Oracle, ochre the slower one.
function speedClass(id) {
  const a = speedMs("funnel"), b = speedMs("relay");
  if (a == null || b == null) return "";
  if (id !== "funnel" && id !== "relay") return "";
  if (a === b) return "fast";
  const mine = id === "funnel" ? a : b;
  return mine < (id === "funnel" ? b : a) ? "fast" : "slow";
}

function paintChoiceSpeeds() {
  document.querySelectorAll("[data-speed-for]").forEach(el => {
    el.textContent = wiz.speedRunning && !wiz.speed ? "Measuring…" : choiceSpeedText(el.dataset.speedFor);
    el.classList.remove("fast", "slow");
    const c = speedClass(el.dataset.speedFor);
    if (c) el.classList.add(c);
  });
  const m = document.querySelector('[data-measure="1"]');
  if (m) { m.disabled = wiz.speedRunning; m.textContent = wiz.speedRunning ? "Measuring…" : "Measure again"; }
  const c = document.querySelector('[data-continue="1"]');
  if (c) c.disabled = wiz.speedRunning;
}

function buildDoor(w) {
  const frag = document.createDocumentFragment();
  frag.appendChild(note("Pick how people will reach your gateway from outside. " +
    "You can change your mind later by running setup again."));
  // The choice lives in wiz, not in this closure: the wizard redraws every few
  // seconds, and a redraw used to put the radio back on the saved door.
  const picked = () => wiz.pick || wiz.door || "funnel";
  const list = document.createElement("div");
  list.className = "choices";
  DOORS.forEach(d => {
    const row = document.createElement("label");
    row.className = "choice";
    const r = document.createElement("input");
    r.type = "radio"; r.name = "door"; r.checked = d.id === picked();
    r.addEventListener("change", () => { wiz.pick = d.id; });
    const t = document.createElement("span"); t.className = "choice-title"; t.textContent = d.title;
    const x = document.createElement("span"); x.className = "choice-text"; x.textContent = d.text;
    const c = document.createElement("span"); c.className = "choice-cost"; c.textContent = d.cost;
    const sp = document.createElement("span");
    sp.className = "choice-speed";
    sp.dataset.speedFor = d.id;
    sp.textContent = choiceSpeedText(d.id);
    // Each redraw rebuilds the cards, so the colour is set here as well as on measure.
    const colour = speedClass(d.id);
    if (colour) sp.classList.add(colour);
    row.append(r, t, x, c, sp);
    list.appendChild(row);
  });
  frag.appendChild(list);

  const measure = async () => {
    if (wiz.speedRunning) return;
    wiz.speedRunning = true;
    paintChoiceSpeeds();
    try {
      wiz.speed = await callBackend("MeasureLatency");
    } catch (err) {
      wiz.speed = null;
    }
    wiz.speedRunning = false;
    paintChoiceSpeeds();
  };
  // Measured once when the screen first opens; the result is kept across redraws.
  if (!wiz.speed && !wiz.speedRunning) measure();

  frag.appendChild(actions(
    (() => { const b = button("Measure again", measure, true); b.dataset.measure = "1"; b.disabled = wiz.speedRunning; return b; })(),
    (() => { const b = button("Continue", () => { wiz.door = picked(); wiz.pick = null; renderWizard(w); });
      // Wait for the measurement, so the person sees the speeds before choosing.
      b.dataset.continue = "1"; b.disabled = wiz.speedRunning; return b; })()));
  return frag;
}

function buildDirectCheck(w) {
  const frag = document.createDocumentFragment();
  frag.appendChild(note("The app asks your router for its internet address. No login is needed. " +
    "Some providers share one address between many customers, and that cannot work this way."));
  const out = document.createElement("div");
  frag.appendChild(out);

  const show = (c) => {
    out.textContent = "";
    const box = document.createElement("div");
    box.className = "verdict-box";
    box.dataset.state = c.public ? "ok" : c.verdict === "unsure" ? "meh" : "bad";
    box.textContent = c.reason;
    out.appendChild(box);
    if (c.public) {
      out.appendChild(actions(button("Continue", () => { wiz.directAck = true; renderWizard(w); })));
    } else {
      out.appendChild(note("The check did not confirm that this way works. Continue anyway only if you know " +
        "your connection allows it, for example after you have opened the port on your router yourself."));
      out.appendChild(actions(
        button("Choose another way", () => { wiz.door = null; wiz.directCheck = null; renderWizard(w); }),
        button("Continue anyway", () => { wiz.directAck = true; renderWizard(w); }, true)));
    }
  };

  if (wiz.directCheck) { show(wiz.directCheck); return frag; }
  frag.appendChild(actions(button("Check my connection", async (b) => {
    b.disabled = true; b.textContent = "Checking…";
    try { wiz.directCheck = await callBackend("CheckDirect"); }
    catch (e) { wiz.directCheck = { public: false, verdict: "unsure", reason: String(e?.message || e) }; }
    renderWizard(w);
  })));
  return frag;
}

function field(label, key, opts = {}) {
  const wrap = document.createElement("label");
  wrap.className = "field";
  const sp = document.createElement("span"); sp.textContent = label;
  const inp = document.createElement("input");
  inp.type = opts.secret ? "password" : "text";
  inp.placeholder = opts.placeholder || "";
  inp.value = wiz.form[key] || "";
  inp.autocomplete = "off"; inp.spellcheck = false;
  // No re-render on input: that would throw away focus on every keystroke.
  inp.addEventListener("input", () => { wiz.form[key] = inp.value.trim(); });
  wrap.append(sp, inp);
  if (opts.help) { const sm = document.createElement("small"); sm.textContent = opts.help; wrap.appendChild(sm); }
  return wrap;
}

// The provider chosen for the direct option. DuckDNS is the default.
function directProvider() {
  return wiz.form.ddns || "duck";
}

function buildAddress(w) {
  const frag = document.createDocumentFragment();
  const fields = document.createElement("div");
  fields.className = "fields";
  const err = document.createElement("div");
  err.className = "verdict-box"; err.dataset.state = "bad"; err.hidden = true;

  if (wiz.door === "relay") {
    frag.appendChild(note("This is the address people will type. Buy a domain name, or use a subdomain " +
      "of one you already own, such as <code>rdgw.yourdomain.com</code>."));
    frag.appendChild(actions(
      button("Buy a domain: Porkbun", () => callBackend("OpenHelp", "porkbun"), true),
      button("Buy a domain: Cloudflare", () => callBackend("OpenHelp", "cloudflare-domains"), true)));
    fields.append(
      field("Domain name", "domain", { placeholder: "rdgw.example.com" }),
      field("Email for certificate notices (optional)", "email", { placeholder: "you@example.com" }));
  } else {
    frag.appendChild(note("Your home address changes now and then, so a name service keeps a fixed name " +
      "pointing at it. Use a provider you already have, or your own domain."));
    const providers = [["duck", "DuckDNS (free)"], ["noip", "No-IP"], ["own", "My own domain or another provider"]];
    const sel = document.createElement("label");
    sel.className = "field";
    const sp = document.createElement("span"); sp.textContent = "Provider";
    const select = document.createElement("select");
    for (const [v, label] of providers) {
      const o = document.createElement("option"); o.value = v; o.textContent = label; select.appendChild(o);
    }
    select.value = directProvider();
    select.addEventListener("change", () => { wiz.form.ddns = select.value; renderWizard(w); });
    sel.append(sp, select);
    fields.appendChild(sel);

    const chosen = directProvider();
    if (chosen === "duck") {
      frag.appendChild(note("DuckDNS: sign in at duckdns.org, create a name, and copy the token shown at the top. " +
        "DuckDNS names are widely recognised by company web filters, so if this PC's network is filtered, " +
        "your own domain is the safer choice."));
      fields.append(
        field("DuckDNS name", "duckName", { placeholder: "myhome", help: "Just the part before .duckdns.org" }),
        field("DuckDNS token", "duckToken", { secret: true }));
    } else if (chosen === "noip") {
      frag.appendChild(note("No-IP: sign in at noip.com, create a hostname, and use that account's username and " +
        "password here. Free No-IP hostnames have to be confirmed every 30 days, or they stop working."));
      fields.append(
        field("No-IP hostname", "noipHost", { placeholder: "myhome.ddns.net" }),
        field("No-IP username", "noipUser"),
        field("No-IP password", "noipPass", { secret: true }));
    } else {
      frag.appendChild(note("Your own domain works when it points at your home address. If it is a CNAME to a " +
        "No-IP or DuckDNS name, paste that provider's update link below: your domain stays the address people type."));
      fields.append(
        field("Your address", "domain", { placeholder: "rdgw.example.com" }),
        field("Update link from your provider (optional)", "ddnsUrl",
          { secret: true, help: "Starts with https://. Leave empty if your address never changes." }));
    }
    fields.append(field("Email for certificate notices (optional)", "email", { placeholder: "you@example.com" }));
  }
  frag.append(fields, err);

  frag.appendChild(actions(button("Continue", () => {
    const f = wiz.form;
    const provider = directProvider();
    if (wiz.door === "relay" && !/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(f.domain)) {
      err.textContent = "Enter a full domain name, like rdgw.example.com."; err.hidden = false; return;
    }
    if (wiz.door === "direct") {
      if (provider === "duck" && (!f.duckName || !f.duckToken)) {
        err.textContent = "Enter the DuckDNS name and token."; err.hidden = false; return;
      }
      if (provider === "noip" && (!f.noipHost || !f.noipUser || !f.noipPass)) {
        err.textContent = "Enter the No-IP hostname, username and password."; err.hidden = false; return;
      }
      if (provider === "own" && !f.domain) {
        err.textContent = "Enter your address, or pick another provider."; err.hidden = false; return;
      }
    }
    wiz.addressOk = true; renderWizard(w);
  })));
  return frag;
}

function buildTailscale(w) {
  const frag = document.createDocumentFragment();
  if (!w.tailscaleInstalled) {
    frag.appendChild(note(wiz.door === "relay"
      ? "Tailscale is the private link between this PC and your server. Nothing is opened on your router."
      : "Tailscale gives this PC an address the outside world can reach, without opening a port on your router."));
    frag.appendChild(note("Install Tailscale first. It takes a minute, then come back here and press Check again."));
    const cmd = "winget install --id Tailscale.Tailscale --scope machine --source winget";
    const pre = document.createElement("pre");
    pre.className = "script";
    pre.textContent = cmd;
    frag.appendChild(pre);
    frag.appendChild(actions(
      button("Open the download page", () => callBackend("OpenTailscaleDownload")),
      button("Copy the command", async (b) => {
        try { await navigator.clipboard.writeText(cmd); b.textContent = "Copied"; } catch {}
        setTimeout(() => (b.textContent = "Copy the command"), 1800);
      }),
      button("Check again", () => pollWizard(), true),
    ));
  } else {
    // Tailscale is installed but this PC is not on a tailnet yet. The wizard
    // polls every few seconds, so this step moves on by itself once it is.
    frag.appendChild(note(wiz.door === "relay"
      ? "Tailscale is installed, but this PC is not connected to it yet. Your server joins the same private network, so this PC and the server can reach each other without opening a port on your router. Open Tailscale from the taskbar, sign in, and connect this PC. This page continues on its own once it is connected."
      : "Tailscale is installed, but this PC is not connected to it yet. Open Tailscale from the taskbar, sign in to your account, and connect this PC to your tailnet. This page will continue on its own when it is connected."));
  }
  return frag;
}

// The gateway program ships inside the installer, so this step normally
// completes by itself. It is only shown if the bundled copy is missing, and
// the fix is to reinstall, not to build anything.
// Funnel needs three switches in the Tailscale admin console. Instead of
// failing at Publish, this step checks each one and gives the exact place to
// click for the one that is off.
function buildFunnelSetup(w) {
  const frag = document.createDocumentFragment();
  frag.appendChild(note("Funnel needs three things switched on in your Tailscale account. The app checks them here and opens the right page for any that is off."));
  const list = document.createElement("div");
  list.className = "checks";
  frag.appendChild(list);

  const line = (ok, title, detail) => {
    const d = document.createElement("div");
    d.className = "check-row";
    const mark = document.createElement("strong");
    mark.textContent = (ok ? "✓ " : "✗ ") + title;
    d.appendChild(mark);
    if (detail) {
      const p = document.createElement("p");
      p.className = "step-note";
      p.textContent = detail;
      d.appendChild(p);
    }
    return d;
  };

  // The wizard redraws every few seconds, so a recent answer is reused rather
  // than asking Tailscale again each time. Buttons pass force = true.
  const check = async (force) => {
    list.textContent = "";
    let r;
    try {
      if (!force && wiz.funnelLast && Date.now() - wiz.funnelAt < 15000) {
        r = wiz.funnelLast;
      } else {
        r = await callBackend("FunnelSetup");
        wiz.funnelLast = r; wiz.funnelAt = Date.now();
      }
    } catch (err) {
      list.appendChild(line(false, "Could not read Tailscale", String(err && err.message || err)));
      list.appendChild(actions(button("Check again", () => check(true), true)));
      return;
    }
    const dnsButton = () => button("Open DNS settings", () => callBackend("OpenTailscaleDNS"));

    list.appendChild(line(r.magicDNS,
      "MagicDNS is on",
      r.magicDNS ? "" : "Admin console → DNS → turn on MagicDNS."));
    if (!r.magicDNS) list.appendChild(actions(dnsButton()));

    list.appendChild(line(r.https,
      "HTTPS certificates are on",
      r.https ? "" : "Admin console → DNS → HTTPS Certificates → Enable HTTPS." +
        (r.httpsDetail ? " Tailscale said: " + r.httpsDetail : "")));
    if (!r.https) list.appendChild(actions(dnsButton()));

    // Permission can only be known by trying to publish. Your access rules
    // may already grant it, so this row is not decided from the policy file.
    list.appendChild(line(r.funnelOn,
      "Funnel is allowed for this PC",
      r.funnelOn ? "" : "Press Turn on Funnel to check this one. It is only shown as off until a publish succeeds."));

    const ready = r.magicDNS && r.https && r.funnelOn;
    wiz.funnelOk = ready;
    if (ready) { pollWizard(); return; }

    const btns = [button("Check again", () => check(true), true)];
    if (r.magicDNS && r.https) {
      btns.unshift(button("Turn on Funnel", async () => {
        try {
          await callBackend("EnableFunnel");
          wiz.funnelOk = true; wiz.funnelLast = null;
          pollWizard();
        } catch (err) {
          list.appendChild(line(false, "Funnel did not publish", String(err && err.message || err)));
          if (r.funnelURL) btns.push(button("Open the page Tailscale gave", () => callBackend("OpenFunnelPage"), true));
          const snippet = document.createElement("pre");
          snippet.className = "script";
          snippet.textContent = '"nodeAttrs": [\n  { "target": ["autogroup:members"], "attr": ["funnel"] }\n]';
          list.appendChild(note("If the message is about access, check the access rules. The default rules already allow Funnel for autogroup:members, so look for an existing funnel entry before adding this:"));
          list.appendChild(snippet);
        }
      }));
    }
    btns.push(button("Open access rules", () => callBackend("OpenTailscaleACL"), true));
    list.appendChild(actions(...btns));
  };

  check(false);
  return frag;
}

// The account the gateway is managed through. The name and password are the
// ones the person picks; an empty password means one is made at the end.
function buildAccount(w) {
  const frag = document.createDocumentFragment();
  frag.appendChild(note("This is the account you sign in to Gitea with to manage the gateway. " +
    "Leave the password empty to have one made; it is shown once at the end of setup."));
  const fields = document.createElement("div");
  fields.className = "fields";
  const err = document.createElement("div");
  err.className = "verdict-box"; err.dataset.state = "bad"; err.hidden = true;
  fields.append(
    field("Account name", "accountName", { placeholder: "rdgw" }),
    field("Password (optional, 12 characters or more)", "accountPass", { secret: true }),
    field("Repeat the password", "accountPass2", { secret: true }),
  );
  frag.append(fields, err);

  const next = () => {
    const name = (wiz.form.accountName || "").trim();
    const pass = wiz.form.accountPass || "";
    const re = /^[A-Za-z0-9][A-Za-z0-9_.-]{0,38}$/;
    let problem = "";
    if (!re.test(name) || name.endsWith(".")) {
      problem = "Use letters, digits, '-', '_' or '.' for the name, and start with a letter or digit.";
    } else if (pass && pass.length < 12) {
      problem = "The password must be at least 12 characters, or left empty.";
    } else if (pass !== (wiz.form.accountPass2 || "")) {
      problem = "The two passwords do not match.";
    }
    if (problem) { err.textContent = problem; err.hidden = false; return; }
    wiz.account = { name, pass };
    wiz.accountOk = true;
    pollWizard();
  };
  frag.appendChild(actions(button("Continue", next)));
  return frag;
}

function buildRdpgw(w) {
  const frag = document.createDocumentFragment();
  frag.appendChild(note(
    "The gateway program is missing from this installation. Reinstall the app " +
    "and it will be put back in place."));
  frag.appendChild(actions(button("Check again", () => pollWizard(), true)));
  return frag;
}

function buildTargets(w) {
  const frag = document.createDocumentFragment();
  frag.appendChild(note(
    "Only the computers you list here can be reached through the gateway. " +
    "Everything else is refused."));

  if (wiz.targets.length === 0 && w.thisMachine) {
    wiz.targets = [{ addr: w.thisMachine + ":3389", on: true, note: "this PC" }];
  }

  const list = document.createElement("div");
  list.className = "targets";
  wiz.targets.forEach((t, i) => {
    const row = document.createElement("label");
    row.className = "target";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.on;
    cb.addEventListener("change", () => { wiz.targets[i].on = cb.checked; });
    const name = document.createElement("span");
    name.className = "target-name";
    name.textContent = t.addr;
    row.append(cb, name);
    if (t.note) {
      const n = document.createElement("span");
      n.className = "target-note";
      n.textContent = t.note;
      row.appendChild(n);
    }
    list.appendChild(row);
  });
  frag.appendChild(list);

  const add = document.createElement("div");
  add.className = "add-target";
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "another-pc:3389";
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") addBtn.click(); });
  const addBtn = button("Add", () => {
    const v = input.value.trim();
    if (!v) return;
    wiz.targets.push({ addr: v.includes(":") ? v : v + ":3389", on: true });
    input.value = "";
    renderWizard(w);
  }, true);
  add.append(input, addBtn);
  frag.appendChild(add);

  const setup = button(wiz.installing ? "Setting up…" : "Set it up", () => startInstall(w));
  setup.disabled = !!wiz.installing;
  frag.appendChild(actions(setup));

  if (wiz.progress.length) frag.appendChild(progressList());
  return frag;
}

function progressList() {
  const d = document.createElement("div");
  d.className = "progress";
  for (const e of wiz.progress) {
    const row = document.createElement("div");
    row.className = "progress-row";
    row.dataset.state = e.state;
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = e.state === "done" ? "✓"
                     : e.state === "failed" ? "✕"
                     : e.state === "skipped" ? "–" : "·";
    const name = document.createElement("span");
    name.textContent = e.step;
    const msg = document.createElement("span");
    msg.className = "msg";
    msg.textContent = e.message || "";
    row.append(mark, name, msg);
    d.appendChild(row);
  }
  return d;
}

async function startInstall(w) {
  if (wiz.installing) return;
  wiz.installing = true;
  wiz.progress = [{ step: "Starting", state: "running", message: "Preparing this PC" }];
  renderWizard(w);

  try {
    const f = wiz.form;
    const provider = directProvider();
    wiz.result = await callBackend("RunInstall", {
      door: wiz.door,
      targets: wiz.targets.filter(t => t.on).map(t => t.addr),
      domain: wiz.door === "direct" && provider !== "own" ? "" : f.domain, email: f.email,
      duckName: wiz.door === "direct" && provider === "duck" ? f.duckName : "",
      duckToken: provider === "duck" ? f.duckToken : "",
      ddnsUrl: wiz.door === "direct" && provider === "own" ? f.ddnsUrl : "",
      noipHost: wiz.door === "direct" && provider === "noip" ? f.noipHost : "",
      noipUser: wiz.door === "direct" && provider === "noip" ? f.noipUser : "",
      noipPass: wiz.door === "direct" && provider === "noip" ? f.noipPass : "",
      adminUser: wiz.account ? wiz.account.name : "",
      adminPassword: wiz.account ? wiz.account.pass : "",
    });
    renderWizard(w);
  } catch (err) {
    wiz.progress.push({ step: "Setup stopped", state: "failed", message: String(err?.message || err) });
    renderWizard(w);
  } finally {
    wiz.installing = false;
  }
}

function buildFinish(w) {
  const frag = document.createDocumentFragment();
  const r = wiz.result;
  if (!r) return frag;

  frag.appendChild(note(
    "This PC is ready. Set up your authenticator app now &mdash; the portal will not " +
    "let anyone in until you do."));

  const box = document.createElement("div");
  box.className = "handover";
  const dl = document.createElement("dl");
  for (const [k, v] of [
    ["Address", r.config.publicDomain || r.config.hostname],
    ["Username", r.config.adminUser],
    ["Password", r.adminPassword || "the one you chose"],
  ]) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  }
  box.appendChild(dl);
  if (r.adminPassword) {
    const warn = document.createElement("p");
    warn.className = "warn";
    warn.textContent = "Write the password down now. It is shown once and not stored.";
    box.appendChild(warn);
  }
  frag.appendChild(box);

  if (wiz.door === "relay") frag.appendChild(relayGuide(r));
  if (wiz.door === "direct") {
    frag.appendChild(note("The app asked your router to forward port 443 here and will keep " +
      "<code>" + escapeHTML(r.config.publicDomain) + "</code> up to date. If your router has UPnP " +
      "switched off, forward TCP port 443 to this PC in its settings. To confirm it works, " +
      "open the address from a phone on mobile data."));
  }

  frag.appendChild(actions(
    button("Set up two-factor", () => callBackend("OpenTwoFactor")),
    button("Go to the dashboard", () => { wiz.result = null; boot(); }, true),
  ));
  return frag;
}

// The server is the one part the app cannot do on its own, so it is walked
// through in the order a person would actually do it, with the one script they
// need ready to copy.
function relayGuide(r) {
  const wrap = document.createElement("div");
  wrap.appendChild(note("<b>One more thing: the server.</b> It takes about 20 minutes the first time."));

  const g = document.createElement("details");
  g.className = "guide"; g.open = true;
  const sm = document.createElement("summary"); sm.textContent = "Step by step";
  g.appendChild(sm);
  const ol = document.createElement("ol");
  const domain = escapeHTML(r.config.publicDomain);
  [
    "<b>Get a server.</b> Create a free Ubuntu server at Oracle. Oracle asks for a card to check your identity, " +
      "but the free server is not charged. Keep the server&rsquo;s public IP address.",
    "<b>Point your domain at it.</b> In your domain&rsquo;s DNS settings, add an <code>A</code> record for " +
      "<code>" + domain + "</code> that points at that IP address.",
    "<b>Run the script.</b> Connect to the server (Oracle&rsquo;s page for the server shows how), paste the script " +
      "below, and sign in to Tailscale with the <b>same account as this PC</b> when it shows a link.",
    "<b>Test it.</b> Press the button below. A green result means the whole path works.",
  ].forEach(h => { const li = document.createElement("li"); li.innerHTML = h; ol.appendChild(li); });
  g.appendChild(ol);

  const help = document.createElement("div");
  help.className = "actions";
  help.append(
    button("Buy a domain: Porkbun", () => callBackend("OpenHelp", "porkbun"), true),
    button("Buy a domain: Cloudflare", () => callBackend("OpenHelp", "cloudflare-domains"), true),
    button("Oracle free server", () => callBackend("OpenHelp", "oracle-free"), true));
  g.appendChild(help);

  const pre = document.createElement("pre");
  pre.className = "script";
  pre.textContent = r.relayScript || "";
  g.appendChild(pre);

  const out = document.createElement("div");
  g.appendChild(actions(
    button("Copy the script", async (b) => {
      try { await navigator.clipboard.writeText(r.relayScript || ""); b.textContent = "Copied"; } catch {}
      setTimeout(() => (b.textContent = "Copy the script"), 1800);
    }),
    button("Test the relay", async (b) => {
      b.disabled = true; b.textContent = "Testing…";
      out.textContent = "";
      try {
        const c = await callBackend("TestPublic");
        const box = document.createElement("div");
        box.className = "verdict-box";
        box.dataset.state = c.state === "ok" ? "ok" : c.state === "warn" ? "meh" : "bad";
        box.textContent = c.detail + (c.hint ? " — " + c.hint : "");
        out.appendChild(box);
      } catch (e) { out.textContent = String(e?.message || e); }
      b.disabled = false; b.textContent = "Test the relay";
    }, true),
  ));
  g.appendChild(out);
  wrap.appendChild(g);
  return wrap;
}

function escapeHTML(s) {
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

let wizardPoll = null;
let lastWizardKey = "";

// force is set by the person's own actions, which always redraw. The timer
// passes false, so an unchanged state does not rebuild the screen.
async function pollWizard(force = true) {
  // A redraw would drop focus while typing, and reset the cards during a measurement.
  const el = document.activeElement;
  const typing = el && el.closest && el.closest("#wizard") &&
    (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && !/^(radio|checkbox)$/.test(el.type)));
  if (typing || wiz.speedRunning) {
    if (!wizardPoll) wizardPoll = setInterval(() => pollWizard(false), 3000);
    return;
  }
  try {
    const w = await callBackend("Wizard");
    // Redraw only when the backend's state changed. An unchanged state used to
    // rebuild the whole screen every few seconds, which dropped focus and colours.
    const key = JSON.stringify(w);
    if (!force && key === lastWizardKey) return;
    lastWizardKey = key;
    renderWizard(w);
    if (!wizardPoll) wizardPoll = setInterval(() => pollWizard(false), 3000);
  } catch (err) {
    console.warn("wizard state unavailable", err);
  }
}

/* ===========================================================================
   Boot
   =========================================================================== */

let dashboardPoll = null;

function show(which) {
  document.getElementById("wizard").hidden = which !== "wizard";
  document.getElementById("dashboard").hidden = which !== "dashboard";
  document.getElementById("verdict").hidden = which !== "dashboard";
}

async function boot() {
  let configured = false;
  try { configured = await callBackend("Configured"); } catch { configured = false; }

  if (configured) {
    show("dashboard");
    if (wizardPoll) { clearInterval(wizardPoll); wizardPoll = null; }
    refresh();
    if (!dashboardPoll) dashboardPoll = setInterval(refresh, 15000);
  } else {
    show("wizard");
    if (dashboardPoll) { clearInterval(dashboardPoll); dashboardPoll = null; }
    pollWizard();
  }
}

// Live progress during installation, emitted per step by the backend.
window.runtime?.EventsOn?.("install:step", (e) => {
  const existing = wiz.progress.find(p => p.step === e.step);
  if (existing) { existing.state = e.state; existing.message = e.message; }
  else wiz.progress.push({ step: e.step, state: e.state, message: e.message });
  const host = document.querySelector(".progress");
  if (host) host.replaceWith(progressList());
});

window.addEventListener("DOMContentLoaded", boot);
</script>
