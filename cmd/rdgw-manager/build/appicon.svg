<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FB5AE"/>
      <stop offset="1" stop-color="#0B4F5C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the gate: an arch, with its ground line -->
  <path d="M142 378 V246 A114 114 0 0 1 370 246 V378" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  <path d="M112 392 H400" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
  <!-- the remote screen behind the gate -->
  <rect x="200" y="232" width="112" height="78" rx="12" fill="none" stroke="#FFFFFF" stroke-width="16"/>
  <path d="M256 310 V322 M226 326 H286" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <!-- the connection leaving through the gate -->
  <path d="M370 271 H424" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <circle cx="450" cy="271" r="24" fill="#FFFFFF"/>
</svg>
